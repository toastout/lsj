<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>저당잼 7스푼 프리셋 캡처기</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600;700;900&family=Libre+Barcode+39+Text&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --bg-color: #f3f4f6;
        --panel-bg: #ffffff;
        --input-bg: #f9fafb;
        --border: #e5e7eb;
        --text-main: #1f2937;
        --text-sub: #6b7280;

        /* 메인 테마 컬러 */
        --accent: #3b4252;
        --accent-hover: #2e3440;
        --shadow: rgba(0, 0, 0, 0.05);

        /* 마지막 공연 티켓 전용 컬러 (크림 & 빈티지 골드) */
        --ticket-bg: #fdfbf7;
        --ticket-border: #e8e3d9;
        --ticket-text: #2c363f;
        --ticket-label: #8c867a;
        --ticket-accent: #b89f71;
      }

      body {
        font-family:
          -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        display: flex;
        height: 100vh;
        color: var(--text-main);
        overflow: hidden;
      }

      @media (max-width: 768px) {
        body {
          flex-direction: column;
          overflow: auto;
          height: auto;
        }
        .editor-panel {
          width: 100% !important;
          height: auto;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .preview-panel {
          height: 100vh;
          padding: 30px 15px; /* 모바일 좌우 패딩 축소 */
          overflow-x: hidden; /* 가로 스크롤 방지 */
        }
      }

      /* ========== 고양이 + zZz 아이콘 래퍼 ========== */
      .icon-wrap {
        display: inline-flex;
        align-items: flex-end;
        margin-right: 6px;
        color: inherit;
      }
      .icon-wrap svg.zzz {
        margin-left: -5px;
        margin-bottom: 8px;
        opacity: 0.8;
      }

      /* ========== 좌측 에디터 패널 ========== */
      .editor-panel {
        width: 420px;
        background-color: var(--panel-bg);
        padding: 25px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        flex-shrink: 0;
        gap: 15px;
        box-shadow: 4px 0 15px var(--shadow);
        z-index: 10;
      }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        padding-bottom: 15px;
        border-bottom: 2px solid var(--border);
      }
      .title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .btn-bread {
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        color: var(--text-main);
        font-size: 1.1rem;
        padding: 4px 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .btn-bread:hover {
        background-color: #e2e8f0;
        transform: translateY(-2px);
      }

      h2 {
        margin: 0;
        font-size: 1.05rem;
        color: var(--text-main);
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      h2 .ver-badge {
        font-size: 0.65rem;
        font-weight: 700;
        color: #fff;
        background: var(--accent);
        padding: 2px 6px;
        border-radius: 4px;
        letter-spacing: 0;
        margin-left: 2px;
      }

      .btn-small {
        padding: 6px 10px;
        background: #f1f5f9;
        color: #475569;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.75rem;
        font-weight: 600;
        transition: 0.2s;
      }
      .btn-small:hover {
        background: #e2e8f0;
      }

      .setting-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 5px;
      }

      .setting-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .setting-row.horizontal {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      label {
        font-size: 0.85rem;
        color: var(--text-main);
        font-weight: 700;
        display: block;
      }

      select,
      input[type="text"],
      textarea {
        width: 100%;
        padding: 10px 12px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        color: var(--text-main);
        border-radius: 8px;
        font-size: 0.9rem;
        font-family: inherit;
        transition: all 0.2s;
      }
      textarea {
        resize: vertical;
        min-height: 80px;
        line-height: 1.5;
      }
      select:focus,
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent);
        background: var(--panel-bg);
        box-shadow: 0 0 0 3px rgba(59, 66, 82, 0.15);
      }

      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
        display: inline-block;
        margin: 0;
      }
      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #cbd5e1;
        border-radius: 24px;
        transition: 0.3s;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        border-radius: 50%;
        transition: 0.3s;
      }
      .toggle-switch input:checked + .toggle-slider {
        background-color: var(--accent);
      }
      .toggle-switch input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }

      .collapsible-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        user-select: none;
        padding: 10px 15px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-weight: 700;
        color: var(--accent);
        margin-top: 10px;
        transition: background 0.2s;
      }
      .collapsible-header:hover {
        background: #f1f5f9;
      }
      .collapsible-header .arrow {
        font-size: 0.7rem;
        transition: transform 0.3s;
      }
      .collapsible-header.open .arrow {
        transform: rotate(180deg);
      }
      .collapsible-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px 10px;
        border-left: 2px solid #cbd5e1;
        margin-left: 5px;
        display: none;
      }
      .collapsible-body.open {
        display: flex;
      }

      .btn-main {
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        flex: 1;
        transition: 0.2s;
        color: white;
        background-color: var(--accent);
        box-shadow: 0 4px 6px rgba(59, 66, 82, 0.2);
        margin-top: auto;
      }
      .btn-main:hover {
        background-color: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(59, 66, 82, 0.3);
      }

      /* ========== 우측 미리보기 패널 (마지막 공연 티켓 스타일) ========== */
      .preview-panel {
        flex: 1;
        background-color: #e5e7eb;
        overflow-y: auto;
        display: flex;
        padding: 40px;
        justify-content: center;
        align-items: flex-start;
      }

      #capture-area {
        /* 모바일에서 펀치홀(-13px)로 인해 100%를 초과하는 문제 수정 */
        width: calc(100% - 28px);
        max-width: 480px;
        margin: 0 auto;
        background-color: transparent;
        position: relative;
        filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.12));
      }

      .ticket-part {
        background-color: var(--ticket-bg);
        position: relative;
        width: 100%;
        border-left: 1px solid var(--ticket-border);
        border-right: 1px solid var(--ticket-border);
      }
      .ticket-top {
        border-radius: 12px 12px 0 0;
        border-top: 1px solid var(--ticket-border);
        padding: 40px 35px 25px 35px;
      }
      .ticket-middle {
        padding: 25px 35px;
      }
      .ticket-bottom {
        border-radius: 0 0 12px 12px;
        border-bottom: 1px solid var(--ticket-border);
        padding: 20px 35px 35px 35px;
      }

      /* 절취선 스타일링 */
      .ticket-divider {
        height: 0;
        border-top: 2px dashed #d5c8b5;
        position: relative;
        background-color: var(--ticket-bg);
        border-left: 1px solid var(--ticket-border);
        border-right: 1px solid var(--ticket-border);
      }
      .ticket-divider::before,
      .ticket-divider::after {
        content: "";
        position: absolute;
        top: -12px;
        width: 24px;
        height: 24px;
        background-color: #e5e7eb;
        border-radius: 50%;
        z-index: 1;
        box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.05);
      }
      .ticket-divider::before {
        left: -13px;
        border-right: 1px solid var(--ticket-border);
      }
      .ticket-divider::after {
        right: -13px;
        border-left: 1px solid var(--ticket-border);
      }

      .ticket-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 15px;
      }
      .ticket-brand {
        font-family: "Noto Serif KR", serif;
        font-size: 0.75rem;
        font-weight: 900;
        color: var(--ticket-accent);
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .ticket-no {
        font-size: 0.75rem;
        color: #a39c91;
        font-family: monospace;
        letter-spacing: 1px;
      }
      .ticket-title {
        font-family: "Noto Serif KR", serif;
        font-size: 2.1rem;
        font-weight: 900;
        color: var(--ticket-text);
        letter-spacing: -1.5px;
        margin: 5px 0 25px 0;
        display: flex;
        align-items: center;
      }

      .ticket-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px 15px; /* 간격 살짝 조정 */
      }
      .ticket-grid.full {
        grid-template-columns: 1fr;
      }

      .ticket-field {
        display: flex;
        flex-direction: row;
        align-items: baseline;
        gap: 8px;
      }
      .ticket-label {
        font-family: "Noto Serif KR", serif;
        font-size: 0.85rem;
        color: var(--ticket-label);
        font-weight: 700;
        min-width: 60px; /* 좁은 텍스트 영역 최적화 */
        flex-shrink: 0; /* 글씨 찌그러짐 방지 */
      }

      .ticket-value {
        font-size: 0.95rem;
        color: var(--ticket-text);
        font-weight: 700;
        word-break: keep-all;
        white-space: pre-wrap;
        transition:
          color 0.2s ease,
          text-shadow 0.2s ease;
      }
      .ticket-value.empty {
        color: #d1d5db;
        font-weight: 500;
      }

      /* ✨ 자연스러운 기본값 하이라이트 (글자색상 및 미세한 글로우 효과) */
      .ticket-value.is-default {
        color: var(--ticket-accent);
        text-shadow: 0 0 1px rgba(184, 159, 113, 0.3);
      }

      .ticket-section-title {
        font-family: "Noto Serif KR", serif;
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--ticket-accent);
        margin: 0 0 15px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ticket-section-title::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--ticket-border);
      }

      .barcode-wrap {
        text-align: center;
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .barcode-img {
        font-family: "Libre Barcode 39 Text", cursive;
        font-size: 3.5rem;
        line-height: 1;
        color: #4a5568;
        margin: 0;
        font-weight: normal;
        opacity: 0.8;
      }

      /* 숟가락 아이콘 스타일 */
      .spoon-icon {
        color: var(--ticket-accent);
        opacity: 0.85;
      }

      /* 모바일 전용 반응형 레이아웃 강화 */
      @media (max-width: 480px) {
        .ticket-top {
          padding: 30px 20px 20px 20px;
        }
        .ticket-middle {
          padding: 25px 20px;
        }
        .ticket-bottom {
          padding: 20px 20px 30px 20px;
        }
        .ticket-title {
          font-size: 1.8rem;
        }
        .ticket-grid {
          gap: 12px 8px;
        }
        .ticket-label {
          min-width: 55px;
          font-size: 0.8rem;
        }
        .ticket-value {
          font-size: 0.9rem;
        }
        .barcode-img {
          font-size: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- 좌측 에디터 패널 -->
    <div class="editor-panel">
      <div class="header-row">
        <div class="title-group">
          <button
            class="btn-bread"
            onclick="window.location.href = 'https://toastout.github.io/toast/'"
            title="홈으로 돌아가기"
          >
            🍞
          </button>
          <h2>
            <!-- 고양이 + zZz SVG -->
            <span class="icon-wrap">
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1.1-3.44 0 0-1.82-6.42-.42-7 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z"
                />
                <path d="M8 14c.5.5 1.5.5 2 0" />
                <path d="M14 14c.5.5 1.5.5 2 0" />
              </svg>
              <svg
                class="zzz"
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 12h6l-6 8h6" />
                <path d="M14 4h6l-6 8h6" />
              </svg>
            </span>
            저당잼 프리셋 <span class="ver-badge">7스푼</span>
          </h2>
        </div>
        <button onclick="resetData()" class="btn-small">초기화</button>
      </div>

      <div class="setting-group">
        <div class="setting-row">
          <label>이어쓰기</label>
          <select id="i_jam" onchange="render()">
            <option value="미개봉">미개봉</option>
            <option value="하">하</option>
            <option value="중">중</option>
            <option value="상">상</option>
          </select>
        </div>
        <div class="setting-row horizontal">
          <div style="flex: 1; padding-right: 10px">
            <label>최대문단수</label>
            <input
              type="text"
              id="i_paragraphh"
              value="2"
              placeholder="예: 2"
              oninput="render()"
            />
          </div>
          <div style="flex: 1">
            <label>최대문장길이</label>
            <input
              type="text"
              id="i_lengthh"
              value="5"
              placeholder="예: 5"
              oninput="render()"
            />
          </div>
        </div>
        <div class="setting-row">
          <label>AI응답모드</label>
          <select id="i_aimode" onchange="render()">
            <option value="RP모드">RP모드</option>
            <option value="HTML모드">HTML모드</option>
            <option value="OOC모드">OOC모드</option>
          </select>
        </div>

        <div class="setting-row">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
            "
          >
            <label>상태창</label>
            <label class="toggle-switch">
              <input type="checkbox" id="c_stat" checked onchange="render()" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- 그룹: 저당잼 -->
      <div class="collapsible-header open" onclick="toggleCollapsible(this)">
        <span style="display: flex; align-items: center">
          <span
            class="icon-wrap"
            style="transform: scale(0.75); margin-right: 4px"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3.1-9-7.56c0-1.25.5-2.4 1.1-3.44 0 0-1.82-6.42-.42-7 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z"
              />
              <path d="M8 14c.5.5 1.5.5 2 0" />
              <path d="M14 14c.5.5 1.5.5 2 0" />
            </svg>
            <svg
              class="zzz"
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 12h6l-6 8h6" />
              <path d="M14 4h6l-6 8h6" />
            </svg>
          </span>
          저당잼 7스푼 설정
        </span>
        <span class="arrow">▼</span>
      </div>
      <div class="collapsible-body open">
        <div class="setting-row horizontal">
          <div style="flex: 1; padding-right: 10px">
            <label>유저</label>
            <select id="i_fog" onchange="render()">
              <option value="불가">불가</option>
              <option value="추측">추측</option>
            </select>
          </div>
          <div style="flex: 1">
            <label>색인</label>
            <select id="i_index" onchange="render()">
              <option value="미개봉">미개봉</option>
              <option value="첨가" selected>첨가</option>
            </select>
          </div>
        </div>
        <div class="setting-row">
          <label>NPC</label>
          <select id="i_snpc" onchange="render()">
            <option value="미개봉">미개봉</option>
            <option value="소극적">소극적</option>
            <option value="적극적" selected>적극적</option>
          </select>
        </div>
        <div class="setting-row horizontal">
          <div style="flex: 1; padding-right: 10px">
            <label>글길이모드</label>
            <select id="i_gal" onchange="render()">
              <option value="엄격">엄격</option>
              <option value="유연">유연</option>
            </select>
          </div>
          <div style="flex: 1">
            <label>장면속도감</label>
            <select id="i_pace" onchange="render()">
              <option value="유지">유지</option>
              <option value="대화">대화</option>
              <option value="흐름">흐름</option>
              <option value="전환" selected>전환</option>
              <option value="생략">생략</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 그룹: 기본 설정 -->
      <div class="collapsible-header open" onclick="toggleCollapsible(this)">
        <span style="display: flex; align-items: center">
          <span
            class="icon-wrap"
            style="transform: scale(0.75); margin-right: 4px"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path

    <script>
      const TEXT_FIELDS = [
        "jam",
        "paragraphh",
        "lengthh",
        "aimode",
        "fog",
        "index",
        "snpc",
        "gal",
        "pace",
        "inner",
        "thinker",
        "style",
        "myap",
        "myan",
      ];

      // 프리셋 기본값 설정 (일치할 경우 컬러 텍스트로 자연스럽게 하이라이트)
      const DEFAULTS = {
        jam: "미개봉",
        paragraphh: "2",
        lengthh: "5",
        fog: "불가",
        index: "첨가",
        snpc: "적극적",
        gal: "엄격",
        pace: "전환",
        inner: "본능/이성",
        thinker: "영어",
        style: "기본잼",
        myan: "보라색산문",
      };

      window.onload = function () {
        const date = new Date();
        const dateString =
          date.getFullYear().toString() +
          String(date.getMonth() + 1).padStart(2, "0") +
          String(date.getDate()).padStart(2, "0");
        document.getElementById("ticket-date").textContent =
          "NO. " + dateString;

        loadData();
        render();
      };

      function toggleCollapsible(header) {
        const body = header.nextElementSibling;
        header.classList.toggle("open");
        body.classList.toggle("open");
      }

      function render() {
        // 텍스트 필드 렌더링 및 하이라이트 체크
        TEXT_FIELDS.forEach((field) => {
          const inputEl = document.getElementById("i_" + field);
          const previewEl = document.getElementById("p_" + field);
          if (inputEl && previewEl) {
            let val = inputEl.value.trim();
            if (!val) {
              previewEl.textContent = "-";
              previewEl.className = "ticket-value empty";
            } else {
              previewEl.textContent = val;
              // 기본값과 일치하면 빈티지 골드 컬러 클래스 추가
              if (DEFAULTS[field] && val === DEFAULTS[field]) {
                previewEl.className = "ticket-value is-default";
              } else {
                previewEl.className = "ticket-value";
              }
            }
          }
        });

        // 상태창 토글 단일 렌더링
        const cStat = document.getElementById("c_stat");
        const pStat = document.getElementById("p_stat");
        if (cStat && pStat) {
          if (cStat.checked) {
            pStat.textContent = "[V] 사용";
            pStat.className = "ticket-value";
          } else {
            pStat.textContent = "[ ] 미사용";
            pStat.className = "ticket-value empty";
          }
        }

        saveData();
      }

      function saveData() {
        const data = {};
        TEXT_FIELDS.forEach((field) => {
          const el = document.getElementById("i_" + field);
          if (el) data[field] = el.value;
        });

        const cStat = document.getElementById("c_stat");
        if (cStat) {
          data.c_stat = cStat.checked;
        }

        localStorage.setItem("jeodang_preset_v7_final", JSON.stringify(data));
      }

      function loadData() {
        const saved = localStorage.getItem("jeodang_preset_v7_final");
        if (saved) {
          try {
            const data = JSON.parse(saved);

            TEXT_FIELDS.forEach((field) => {
              const el = document.getElementById("i_" + field);
              if (el && data[field] !== undefined) {
                el.value = data[field];
              }
            });

            const cStat = document.getElementById("c_stat");
            if (cStat && data.c_stat !== undefined) {
              cStat.checked = data.c_stat;
            }
          } catch (e) {
            console.error("데이터 로드 실패", e);
          }
        }
      }

      function resetData() {
        if (confirm("입력한 설정을 모두 초기화하시겠습니까?")) {
          localStorage.removeItem("jeodang_preset_v7_final");
          location.reload();
        }
      }

      function saveImage() {
        const captureArea = document.getElementById("capture-area");
        window.scrollTo(0, 0);

        html2canvas(captureArea, {
          scale: 2,
          backgroundColor: null,
          useCORS: true,
        }).then((canvas) => {
          const imgData = canvas.toDataURL("image/png");
          const isIOS =
            /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

          if (isIOS) {
            const modal = document.getElementById("save-modal");
            const modalImg = document.getElementById("save-modal-img");
            modalImg.src = imgData;
            modal.style.display = "flex";
          } else {
            const link = document.createElement("a");
            link.download = "저당잼_7스푼_티켓_v7.png";
            link.href = imgData;
            link.click();
          }
        });
      }

      function closeSaveModal(e) {
        if (!e || e.target === document.getElementById("save-modal")) {
          const modal = document.getElementById("save-modal");
          modal.style.display = "none";
          document.getElementById("save-modal-img").src = "";
        }
      }
    </script>
